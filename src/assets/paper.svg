<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0.55 0 0 0 -0.2"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.78  0 0 0 0 0.62  0 0 0 0 0.38  0.7 0 0 0 -0.3"/>
  </filter>
  <rect width="560" height="560" fill="#f7efdf"/>
  <rect width="560" height="560" filter="url(#mottle)"/>
  <rect width="560" height="560" filter="url(#grain)"/>
</svg>
